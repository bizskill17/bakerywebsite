# Uploads the website to Hostinger over FTP every time something is pushed to main.
# Only changed files are uploaded. Files created on the server (config.php, uploads/, data/)
# are never touched.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME_RAW: ${{ secrets.FTP_USERNAME }}
    steps:
      - name: Check FTP password is set
        if: env.FTP_PASSWORD == ''
        run: |
          echo "::warning::FTP_PASSWORD secret is missing. Add it in GitHub → Settings → Secrets and variables → Actions, then re-run this workflow."

      - name: Clean up server name and username
        if: env.FTP_PASSWORD != ''
        run: |
          # accept "ftp://147.93.92.210", "147.93.92.210/" or with spaces
          server=$(echo "$FTP_SERVER_RAW" | sed -E 's#^[a-z]+://##; s#/.*$##; s/[[:space:]]//g')
          user=$(echo "$FTP_USERNAME_RAW" | tr -d '[:space:]')
          echo "FTP_SERVER=$server" >> "$GITHUB_ENV"
          echo "FTP_USERNAME=$user" >> "$GITHUB_ENV"

      - name: Get the code
        if: env.FTP_PASSWORD != ''
        uses: actions/checkout@v4

      - name: Upload to Hostinger
        if: env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config.php
            uploads/*.jpg
            data/*.sqlite
