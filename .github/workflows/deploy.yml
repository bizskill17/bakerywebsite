# Uploads the website to Hostinger over FTP every time something is pushed to main.
# Files created on the server (config.php, uploads/ photos, data/) are never touched or deleted.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME_RAW: ${{ secrets.FTP_USERNAME }}
    steps:
      - name: Check secrets are set
        if: env.FTP_PASSWORD == '' || env.FTP_SERVER_RAW == '' || env.FTP_USERNAME_RAW == ''
        run: |
          echo "::error::Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in GitHub → Settings → Secrets and variables → Actions."
          exit 1

      - name: Get the code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Hostinger
        run: |
          # accept "ftp://147.93.92.210", "147.93.92.210/" or values with stray spaces
          server=$(printf '%s' "$FTP_SERVER_RAW" | sed -E 's#^[a-z]+://##; s#/.*$##; s/[[:space:]]//g')
          user=$(printf '%s' "$FTP_USERNAME_RAW" | tr -d '[:space:]')
          export LFTP_PASSWORD="$FTP_PASSWORD"

          lftp -u "$user" --env-password "$server" <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          mirror --reverse --verbose --parallel=2 \
            --exclude '^\.git/' \
            --exclude '^\.github/' \
            --exclude '^\.gitignore$' \
            --exclude '^README\.md$' \
            --exclude '^config\.php$' \
            --exclude '^uploads/.*\.jpg$' \
            --exclude '^data/.*\.sqlite$' \
            ./ public_html/
          # never keep Git's internal folder on the web server
          rm -r -f public_html/.git
          bye
          EOF
          echo "✅ Website uploaded to Hostinger"
