# Uploads the website to Hostinger over FTP every time something is pushed to main.
# Files created on the server (config.php, uploads/ photos, data/) are never touched or deleted.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME_RAW: ${{ secrets.FTP_USERNAME }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Check secrets are set
        if: env.FTP_PASSWORD == '' || env.FTP_SERVER_RAW == '' || env.FTP_USERNAME_RAW == ''
        run: |
          echo "::error::Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in GitHub → Settings → Secrets and variables → Actions."
          exit 1

      - name: Get the code
        uses: actions/checkout@v4

      - name: Build config.php from secrets
        if: env.DB_NAME != '' && env.DB_USER != '' && env.DB_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/cfg"
          php -r '
            $c = ["driver" => "mysql", "host" => (trim((string)getenv("DB_HOST")) ?: "localhost"), "port" => 3306,
                  "name" => trim(getenv("DB_NAME")), "user" => trim(getenv("DB_USER")), "pass" => getenv("DB_PASSWORD")];
            $u = trim((string)getenv("ADMIN_USERNAME")); $p = (string)getenv("ADMIN_PASSWORD");
            if ($u !== "" && $p !== "") { $c["admin_user"] = $u; $c["admin_hash"] = password_hash($p, PASSWORD_DEFAULT); }
            file_put_contents(getenv("RUNNER_TEMP") . "/cfg/config.php",
              "<?php\n// Written by GitHub Actions from repository secrets. Do not edit on the server.\nreturn " . var_export($c, true) . ";\n");
          '
          echo "config.php prepared"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Hostinger
        run: |
          # accept "ftp://147.93.92.210", "147.93.92.210/" or values with stray spaces
          server=$(printf '%s' "$FTP_SERVER_RAW" | sed -E 's#^[a-z]+://##; s#/.*$##; s/[[:space:]]//g')
          user=$(printf '%s' "$FTP_USERNAME_RAW" | tr -d '[:space:]')
          export LFTP_PASSWORD="$FTP_PASSWORD"
          script="$RUNNER_TEMP/deploy.lftp"

          cat > "$script" <<'EOF'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          mirror --reverse --verbose --parallel=2 --exclude '^\.git/' --exclude '^\.github/' --exclude '^\.gitignore$' --exclude '^README\.md$' --exclude '^config\.php$' --exclude '^uploads/.*\.jpg$' --exclude '^data/.*\.sqlite$' --exclude '^default\.php$' ./ ./
          rm -r -f .git
          EOF

          # settings file built from secrets (only when the DB secrets exist)
          if [ -f "$RUNNER_TEMP/cfg/config.php" ]; then
            echo "put $RUNNER_TEMP/cfg/config.php -o config.php" >> "$script"
          else
            echo "::notice::DB secrets not set – leaving config.php on the server unchanged."
          fi

          lftp -u "$user" --env-password -e "source $script; bye" "$server"

          echo "----- what is on the server -----"
          lftp -u "$user" --env-password -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; pwd; echo '[website folder]'; cls -1a; bye" "$server" || true
          echo "✅ Website uploaded to Hostinger"
